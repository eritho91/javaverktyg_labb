<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movies</title>
</head>
<body>
<h1>Movie List</h1>

<ul>
    <li th:each="movie : ${movies}" style="margin-bottom: 20px;>
        <strong th:text="${movie.title}"></strong><br>
        Release year: <span th:text="${movie.year}"></span><br>
        Director: <span th:text="${movie.director}"></span><br>
        Genre: <span th:text="${movie.genre}"></span><br>

    </li>
</ul>
</body>
</html>
